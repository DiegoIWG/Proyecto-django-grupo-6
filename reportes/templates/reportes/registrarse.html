<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta</title>
</head>
<body>

    <h1>Crear cuenta</h1>

    <p>
        Regístrate para participar en
        Tu opinión SÍ importa.

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

    <p>

    <a href="{% url 'inicio' %}">
        Volver al foro
    </a>

</body>
</html>
