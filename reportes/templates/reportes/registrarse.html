{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta</title>

    <link rel="stylesheet"
        href="{% static 'reportes/css/estilos.css' %}">
</head>

<body>

    <main class="pagina-cuenta">

        <div class="cuenta-intro">

            <div class="cuenta-emblema">🌿</div>

            <h1>Crea tu cuenta</h1>

            <p>
                Regístrate para publicar reportes
                y participar en tu comunidad.
            </p>

        </div>

        <section class="cuenta-tarjeta">

            <form method="POST">
                {% csrf_token %}

                {{ formulario.as_p }}

                <button type="submit">
                    Crear cuenta
                </button>
            </form>

            <div class="cuenta-pie">

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="{% url 'iniciar_sesion' %}">
                        Iniciar sesión
                    </a>
                </p>

                <p>
                    <a href="{% url 'inicio' %}">
                        ← Volver al foro
                    </a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
