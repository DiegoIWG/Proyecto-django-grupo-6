{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet"
        href="{% static 'reportes/css/estilos.css' %}">
</head>

<body>

    <main class="pagina-cuenta">

        <div class="cuenta-intro">
            <div class="cuenta-emblema">🌿</div>

            <h1>Bienvenido a nuestra comunidad</h1>

            <p>
                Participa en los reportes ambientales
                de Quintero y Puchuncaví.
            </p>
        </div>

        <section class="cuenta-tarjeta">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                {% if next %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >
                {% endif %}

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>

            <div class="cuenta-pie">
                <p>
                    ¿Todavía no tienes cuenta?
                    <a href="{% url 'registrarse' %}">
                        Regístrate
                    </a>
                </p>
            </div>

        </section>

        <div class="cuenta-volver">
            <a href="{% url 'inicio' %}">
                ← Volver al foro
            </a>
        </div>

    </main>

</body>
</html>
